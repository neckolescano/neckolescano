<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" fill="none" role="img" aria-label="Draw it first. Then build it, layer by layer."><title>Draw it first. Then build it, layer by layer.</title><defs></defs><style>.s0{animation:s0 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes s0{50%{transform:translateY(10px)}}.s1{animation:s1 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes s1{50%{transform:translateY(0px)}}.s2{animation:s2 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes s2{50%{transform:translateY(-10px)}}</style><rect x="0" y="0" width="1000" height="1" fill="rgba(244,239,230,0.14)"/><text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f4efe6" text-anchor="start" letter-spacing="-0.8">Draw it first. Then build it,</text><text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#8b8781" text-anchor="start" letter-spacing="-0.8">layer by layer.</text><g class="s0"><g transform="matrix(0.866,0.5,-0.866,0.5,880,30)"><rect width="110" height="70" rx="8" fill="#16181d" stroke="rgba(244,239,230,0.28)" stroke-opacity="0.35"/></g></g><g class="s1"><g transform="matrix(0.866,0.5,-0.866,0.5,880,48)"><rect width="110" height="70" rx="8" fill="#16181d" stroke="rgba(244,239,230,0.28)" stroke-opacity="0.6"/></g></g><g class="s2"><g transform="matrix(0.866,0.5,-0.866,0.5,880,66)"><rect width="110" height="70" rx="8" fill="#16181d" stroke="#e2763f" stroke-opacity="1"/></g></g></svg>