<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="36" viewBox="0 0 1000 36" fill="none" role="img" aria-label="04 Certificates"><title>04 Certificates</title><defs></defs><style>.tr{animation:tr 9s cubic-bezier(.65,0,.35,1) infinite}@keyframes tr{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(761px);opacity:0}}.ln{transform-box:fill-box;transform-origin:left;animation:ln 1.6s cubic-bezier(.22,1,.36,1) both .2s}@keyframes ln{from{transform:scaleX(0)}}.hd{opacity:0;animation:hd 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes hd{0%,100%{opacity:0}8%{opacity:.9}25%{opacity:0}}</style><text x="0" y="22" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#cf5f28" text-anchor="start" letter-spacing="1.2">04</text><text x="32" y="22" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.2">CERTIFICATES</text><rect class="ln" x="156" y="17.5" width="761" height="1" fill="rgba(20,20,20,0.26)"/><text x="1000" y="22" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="11" font-weight="500" fill="#6b6862" text-anchor="end" letter-spacing="1.2">3 EARNED</text><circle class="tr" cx="156" cy="18" r="2.5" fill="#cf5f28"/></svg>